model:
  bdh:
    model_name: "bdh-small"  # or path to local checkpoint
    vocab_size: 50257
    d_model: 512
    n_layers: 12
    n_heads: 8
    d_ff: 2048
    max_seq_len: 1024
    dropout: 0.1
    sparsity_target: 0.05  # target sparsity for activations
    hebbian_lr: 0.01       # Hebbian learning rate
    inhibition_strength: 1.0
    checkpoint_path: null  # set to path if loading pretrained
    device: "cuda"         # or "cpu", "mps"
  
  transformer:
    model_name: "transformer-baseline"
    vocab_size: 50257
    d_model: 512
    n_layers: 12
    n_heads: 8
    d_ff: 2048
    max_seq_len: 1024
    dropout: 0.1
    checkpoint_path: null
    device: "cuda"

training:
  batch_size: 32
  learning_rate: 3e-4
  weight_decay: 0.01
  max_epochs: 10
  warmup_steps: 1000
  gradient_clip: 1.0
  mixed_precision: true
  compile_model: false  # torch.compile
  seed: 42
  num_workers: 4

instrumentation:
  graph_extraction:
    node_type: "neuron"
    edge_type: "correlation"
    correlation_threshold: 0.3
    top_k_edges: null  # if set, keep only top-k edges per node
    sample_batches: 100
    sample_seq_len: 512
    target_layers: null
  
  metrics:
    compute_sparsity: true
    compute_modularity: true
    compute_degree_distribution: true
    compute_clustering: true
    compute_path_length: true
    compute_rich_club: true
    modularity_resolution: 1.0
    community_algorithm: "louvain"  # "louvain", "leiden", "label_propagation"

continual_learning:
  tasks:
    - name: "task_a"
      dataset: "split_mnist"
      task_id: 0
      num_classes: 5
    - name: "task_b"
      dataset: "split_mnist"
      task_id: 1
      num_classes: 5
  
  epochs_per_task: 5
  eval_frequency: 1
  compute_forgetting: true
  compute_forward_transfer: true
  compute_backward_transfer: true
  replay:
    enabled: false
    buffer_size: 1000
    strategy: "random"  # "random", "herding", "reservoir"

long_context:
  tasks:
    - name: "needle_in_haystack"
      context_lengths: [1024, 2048, 4096, 8192, 16384, 32768]
      num_samples: 100
      needle_type: "random_token"
    - name: "multi_hop_qa"
      context_lengths: [2048, 4096, 8192, 16384]
      num_samples: 50
      num_hops: 3
    - name: "variable_tracking"
      context_lengths: [1024, 2048, 4096, 8192]
      num_samples: 100
      num_variables: 5
  
  eval_batch_size: 8
  generation_max_tokens: 128
  temperature: 0.0
  top_p: 1.0

visualization:
  graph_view:
    layout: "force_directed"  # "force_directed", "circular", "hierarchical"
    node_size_factor: 10
    edge_width_factor: 2
    max_nodes_display: 500
    color_by: "community"  # "community", "degree", "layer", "activation"
  
  plots:
    style: "seaborn-v0_8-whitegrid"
    dpi: 150
    figsize: [10, 6]
    save_format: "png"  # "png", "pdf", "svg"
    color_palette: "viridis"

dashboard:
  host: "0.0.0.0"
  port: 8501
  theme: "light"
  refresh_interval: 30
  live_updates: true

logging:
  level: "INFO"
  log_dir: "logs/"
  wandb:
    enabled: false
    project: "neurolens"
    entity: null
    tags: ["bdh", "instrumentation", "continual-learning", "long-context"]
  tensorboard:
    enabled: true
    log_dir: "runs/"

paths:
  data_dir: "data/"
  results_dir: "results/"
  checkpoints_dir: "checkpoints/"
  assets_dir: "assets/"
  notebooks_dir: "notebooks/"
